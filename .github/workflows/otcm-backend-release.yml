name: Publish OTCM backend only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only diagnostics, or test and publish a backend revision with backup and rollback
        type: choice
        required: true
        default: inspect
        options: [inspect, publish]
      backend_revision:
        description: Exact reviewed 40-character backend revision (required for publish)
        type: string
        required: false
      expected_backend_sha256:
        description: SHA256 of the reviewed current production backend
        type: string
        required: true
        default: 4d30e97954c0c5883da5630bb439a7a52ce9ac97f913a2098c98c60602638e79
      expected_frontend_revision:
        description: Current frontend revision that must remain untouched
        type: string
        required: true
        default: 326b0fa8ca2aa25bc976d9a5a16c845fd373fa43

permissions:
  contents: read
  actions: read

concurrency:
  group: otcm-production-promotion
  cancel-in-progress: false

jobs:
  backend:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate request and test backend release guards
        env:
          MODE: ${{ inputs.mode }}
          REVISION: ${{ inputs.backend_revision }}
          EXPECTED_BACKEND: ${{ inputs.expected_backend_sha256 }}
          EXPECTED_FRONTEND: ${{ inputs.expected_frontend_revision }}
        run: |
          set -euo pipefail
          [[ "$MODE" == inspect || "$MODE" == publish ]]
          [[ "$EXPECTED_BACKEND" =~ ^[0-9a-f]{64}$ && "$EXPECTED_FRONTEND" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$MODE" == publish ]]; then [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; fi
          python3 -B -m unittest discover -s ops -p test_otcm_backend_release.py
          mkdir -p "$RUNNER_TEMP/otcm-backend/release"
      - uses: actions/checkout@v4
        if: inputs.mode == 'publish'
        with:
          ref: ${{ inputs.backend_revision }}
          path: backend
      - uses: actions/setup-java@v4
        if: inputs.mode == 'publish'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Test and package exact backend revision
        if: inputs.mode == 'publish'
        working-directory: backend
        env:
          REVISION: ${{ inputs.backend_revision }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$REVISION" ]]
          sudo apt-get update -qq && sudo apt-get install -y fonts-wqy-zenhei
          python3 ops/check_smtp_secrets.py
          mvn -B --settings .github/maven-settings.xml clean package
          cp ruoyi-admin/target/ruoyi-admin.jar "$RUNNER_TEMP/otcm-backend/release/backend.jar"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'otcm-backend/release')
          manifest = {'revision':os.environ['REVISION'], 'publicBaseUrl':'https://www.otcm.app',
                      'sha256':hashlib.sha256((root/'backend.jar').read_bytes()).hexdigest()}
          (root/'manifest.json').write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'publish'
        id: artifact
        with:
          name: otcm-backend-release
          path: ${{ runner.temp }}/otcm-backend/release/*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Prepare fixed-host backend operation
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          REVISION: ${{ inputs.backend_revision }}
          EXPECTED_BACKEND: ${{ inputs.expected_backend_sha256 }}
          EXPECTED_FRONTEND: ${{ inputs.expected_frontend_revision }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'otcm-backend')
          request = {'target':'43.166.154.98', 'mode':os.environ['MODE'],
                     'expectedBackendSha256':os.environ['EXPECTED_BACKEND'],
                     'expectedFrontendRevision':os.environ['EXPECTED_FRONTEND']}
          if request['mode'] == 'publish':
              manifest = json.loads((root/'release/manifest.json').read_text())
              assert manifest['revision'] == os.environ['REVISION']
              artifact_id = os.environ['ARTIFACT_ID']
              assert artifact_id.isdigit()
              url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/artifacts/' + artifact_id + '/zip'
              headers = subprocess.check_output(['curl','--silent','--show-error','--fail','--max-time','30','-D','-','-o','/dev/null',
                  '-H','Authorization: Bearer '+os.environ['GH_TOKEN'], url]).decode()
              signed_url, = [line.split(':',1)[1].strip() for line in headers.splitlines() if line.lower().startswith('location:')]
              print('::add-mask::'+signed_url)
              request.update(revision=manifest['revision'], sha256=manifest['sha256'], artifactUrl=signed_url)
          lines = ['import base64, sys, types']
          for name in ('legacy_integration_diagnostics','production_deploy','otcm_promotion','otcm_session_config','otcm_frontend_release','otcm_backend_release'):
              encoded = base64.b64encode(pathlib.Path('ops',name+'.py').read_bytes()).decode()
              lines += [f'module = types.ModuleType({name!r})', f'sys.modules[{name!r}] = module',
                        f'exec(compile(base64.b64decode({encoded!r}),{name!r},"exec"),module.__dict__)']
          lines += ['sys.modules["otcm_backend_release"].REQUEST='+repr(request), 'sys.exit(sys.modules["otcm_backend_release"].main())']
          (root/'payload.py').write_text('\n'.join(lines))
          PY
      - name: Run guarded OTCM backend operation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" == '43.166.154.98' ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ && -n "$DEPLOY_SSH_KEY" ]]
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$PORT >= 1 && 10#$PORT <= 65535 ))
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/otcm-backend/key"
          ssh-keyscan -T 15 -p "$PORT" "$DEPLOY_HOST" > "$RUNNER_TEMP/otcm-backend/known_hosts" 2>/dev/null
          ssh -p "$PORT" -i "$RUNNER_TEMP/otcm-backend/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o LogLevel=ERROR \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/otcm-backend/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -B -' \
            < "$RUNNER_TEMP/otcm-backend/payload.py" > "$RUNNER_TEMP/otcm-backend/report.json"
      - name: Save sanitized backend operation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otcm-backend-operation-report
          path: ${{ runner.temp }}/otcm-backend/report.json
          retention-days: 30
      - name: Remove runner SSH material
        if: always()
        run: rm -f "$RUNNER_TEMP/otcm-backend/key" "$RUNNER_TEMP/otcm-backend/payload.py"
