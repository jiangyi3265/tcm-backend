name: Publish OTCM frontend only

on:
  workflow_dispatch:
    inputs:
      frontend_revision:
        description: Exact reviewed 40-character commit in jiangyi3265/tcm-app
        required: true
        type: string
      expected_frontend_revision:
        description: Exact current production frontend revision, checked before any change
        required: true
        type: string
        default: 4e42f8118a303b09c3f6131144b60216b10217b3
      mode:
        description: Validate only, or back up and atomically publish the tested frontend
        required: true
        type: choice
        default: inspect
        options: [inspect, publish]

permissions:
  contents: read

concurrency:
  group: otcm-production-promotion
  cancel-in-progress: false

jobs:
  frontend:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit revisions
        env:
          REVISION: ${{ inputs.frontend_revision }}
          EXPECTED: ${{ inputs.expected_frontend_revision }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ && "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVISION" != "$EXPECTED" ]]
      - uses: actions/checkout@v4
        with:
          repository: jiangyi3265/tcm-app
          ref: ${{ inputs.frontend_revision }}
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test fixed-host release guards and rollback
        run: python3 -B -m unittest discover -s ops -p test_otcm_frontend_release.py
      - name: Test and build exact frontend revision for OTCM
        working-directory: frontend
        env:
          VITE_PUBLIC_APP_BASE_URL: https://www.otcm.app
          VITE_APP_VERSION: ${{ inputs.frontend_revision }}
        run: |
          npm ci
          node --test tests/*.test.js
          npm run build
      - name: Package and prepare frontend-only operation
        env:
          REVISION: ${{ inputs.frontend_revision }}
          EXPECTED: ${{ inputs.expected_frontend_revision }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/otcm-frontend/release"
          tar -C frontend/dist -czf "$RUNNER_TEMP/otcm-frontend/release/frontend.tar.gz" .
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'otcm-frontend')
          bundle = (root/'release/frontend.tar.gz').read_bytes()
          manifest = {'revision':os.environ['REVISION'], 'expectedRevision':os.environ['EXPECTED'],
                      'publicBaseUrl':'https://www.otcm.app', 'sha256':hashlib.sha256(bundle).hexdigest()}
          (root/'release/manifest.json').write_text(json.dumps(manifest, indent=2))
          request = {**manifest, 'mode':os.environ['MODE'], 'target':'43.166.154.98',
                     'archiveBase64':base64.b64encode(bundle).decode()}
          source = base64.b64encode(pathlib.Path('ops/otcm_frontend_release.py').read_bytes()).decode()
          lines = ['import base64, sys, types', 'module = types.ModuleType("otcm_frontend_release")',
                   'sys.modules["otcm_frontend_release"] = module',
                   f'exec(compile(base64.b64decode({source!r}), "otcm_frontend_release", "exec"), module.__dict__)',
                   'module.REQUEST=' + repr(request), 'sys.exit(module.main())']
          (root/'payload.py').write_text('\n'.join(lines))
          print(json.dumps(manifest))
          PY
      - name: Fixed OTCM host frontend operation
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" == '43.166.154.98' ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ && -n "$DEPLOY_SSH_KEY" ]]
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$PORT >= 1 && 10#$PORT <= 65535 ))
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/otcm-frontend/key"
          ssh-keyscan -T 15 -p "$PORT" "$DEPLOY_HOST" > "$RUNNER_TEMP/otcm-frontend/known_hosts" 2>/dev/null
          ssh -p "$PORT" -i "$RUNNER_TEMP/otcm-frontend/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o LogLevel=ERROR \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/otcm-frontend/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -B -' \
            < "$RUNNER_TEMP/otcm-frontend/payload.py" > "$RUNNER_TEMP/otcm-frontend/report.json"
      - name: Retain frontend artifact and sanitized release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otcm-frontend-release
          path: |
            ${{ runner.temp }}/otcm-frontend/release/*
            ${{ runner.temp }}/otcm-frontend/report.json
          retention-days: 14
      - name: Remove SSH credentials and payload
        if: always()
        run: rm -f "$RUNNER_TEMP/otcm-frontend/key" "$RUNNER_TEMP/otcm-frontend/payload.py"
