name: Correct OTCM session duration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or apply the reviewed 120-to-1440-minute session configuration correction
        type: choice
        required: true
        default: inspect
        options: [inspect, apply]
      build_run:
        description: Optional already-staged release build run; requires both backend identity fields
        required: false
        type: string
      backend_revision:
        description: Reviewed 40-character backend revision from the staged manifest
        required: false
        type: string
      backend_sha256:
        description: Reviewed 64-character backend JAR SHA-256
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: otcm-production-promotion
  cancel-in-progress: false

jobs:
  correct:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run local guard and rollback tests
        run: python3 -B -m unittest discover -s ops -p test_otcm_session_config.py
      - name: Apply only the fixed OTCM service configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          MODE: ${{ inputs.mode }}
          BUILD_RUN: ${{ inputs.build_run }}
          BACKEND_REVISION: ${{ inputs.backend_revision }}
          BACKEND_SHA256: ${{ inputs.backend_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" == '43.166.154.98' ]]
          [[ "$MODE" == inspect || "$MODE" == apply ]]
          EXTRA_ARGS=''
          if [[ -n "$BUILD_RUN$BACKEND_REVISION$BACKEND_SHA256" ]]; then
            [[ "$BUILD_RUN" =~ ^[0-9]{8,20}$ ]]
            [[ "$BACKEND_REVISION" =~ ^[0-9a-f]{40}$ && "$BACKEND_SHA256" =~ ^[0-9a-f]{64}$ ]]
            EXTRA_ARGS="--build-run $BUILD_RUN --backend-revision $BACKEND_REVISION --backend-sha256 $BACKEND_SHA256"
          fi
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ && -n "$DEPLOY_SSH_KEY" ]]
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$PORT >= 1 && 10#$PORT <= 65535 ))
          mkdir -p "$RUNNER_TEMP/otcm-session-config"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/otcm-session-config/key"
          ssh-keyscan -T 15 -p "$PORT" "$DEPLOY_HOST" > "$RUNNER_TEMP/otcm-session-config/known_hosts" 2>/dev/null
          python3 - <<'PY'
          import base64, os, pathlib
          lines = ['import base64, sys, types']
          for name in ('legacy_integration_diagnostics', 'otcm_promotion', 'otcm_session_config'):
              encoded = base64.b64encode(pathlib.Path('ops', name + '.py').read_bytes()).decode()
              lines += [f'module = types.ModuleType({name!r})', f'sys.modules[{name!r}] = module',
                        f'exec(compile(base64.b64decode({encoded!r}), {name!r}, "exec"), module.__dict__)']
          lines += ['sys.exit(sys.modules["otcm_session_config"].main())']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'otcm-session-config', 'payload.py').write_text('\n'.join(lines))
          PY
          ssh -p "$PORT" -i "$RUNNER_TEMP/otcm-session-config/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o LogLevel=ERROR \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/otcm-session-config/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "python3 -B - --target 43.166.154.98 --mode $MODE $EXTRA_ARGS" \
            < "$RUNNER_TEMP/otcm-session-config/payload.py" > "$RUNNER_TEMP/otcm-session-config/report.json"
      - name: Save sanitized session-duration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otcm-session-config-report
          path: ${{ runner.temp }}/otcm-session-config/report.json
          retention-days: 30
      - name: Remove runner SSH material
        if: always()
        run: rm -f "$RUNNER_TEMP/otcm-session-config/key" "$RUNNER_TEMP/otcm-session-config/payload.py"
