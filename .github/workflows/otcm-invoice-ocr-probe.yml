name: Verify OTCM synthetic invoice OCR

on:
  workflow_dispatch:
    inputs:
      expected_backend_sha256:
        description: SHA256 of the reviewed current production backend
        type: string
        required: true
      expected_frontend_revision:
        description: Exact current frontend revision that must remain untouched
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: otcm-production-promotion
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test guards and package isolated recognition probe
        env:
          EXPECTED_BACKEND: ${{ inputs.expected_backend_sha256 }}
          EXPECTED_FRONTEND: ${{ inputs.expected_frontend_revision }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_BACKEND" =~ ^[0-9a-f]{64}$ && "$EXPECTED_FRONTEND" =~ ^[0-9a-f]{40}$ ]]
          python3 -B -m unittest discover -s ops -p test_otcm_invoice_ocr_probe.py -v
          mkdir -p "$RUNNER_TEMP/otcm-invoice-ocr/probe"
          javac --release 17 -encoding UTF-8 -d "$RUNNER_TEMP/otcm-invoice-ocr/probe" ops/OtcmInvoiceOcrProbe.java
          jar --create --no-manifest --file "$RUNNER_TEMP/otcm-invoice-ocr/ocr-probe.jar" \
            -C "$RUNNER_TEMP/otcm-invoice-ocr/probe" OtcmInvoiceOcrProbe.class \
            -C "$RUNNER_TEMP/otcm-invoice-ocr/probe" 'OtcmInvoiceOcrProbe$SilentLoggingConfiguration.class'
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'otcm-invoice-ocr')
          request = {'target': '43.166.154.98', 'expectedBackendSha256': os.environ['EXPECTED_BACKEND'],
                     'expectedFrontendRevision': os.environ['EXPECTED_FRONTEND'],
                     'probeJarBase64': base64.b64encode((root/'ocr-probe.jar').read_bytes()).decode()}
          lines = ['import base64, sys, types']
          for name in ('legacy_integration_diagnostics', 'otcm_promotion', 'otcm_session_config',
                       'otcm_frontend_release', 'otcm_backend_release', 'otcm_invoice_ocr_probe'):
              encoded = base64.b64encode(pathlib.Path('ops', name + '.py').read_bytes()).decode()
              lines += [f'module = types.ModuleType({name!r})', f'sys.modules[{name!r}] = module',
                        f'exec(compile(base64.b64decode({encoded!r}), {name!r}, "exec"), module.__dict__)']
          lines += ['sys.modules["otcm_invoice_ocr_probe"].REQUEST=' + repr(request),
                    'sys.exit(sys.modules["otcm_invoice_ocr_probe"].main())']
          (root/'payload.py').write_text('\n'.join(lines))
          PY
      - name: Read configuration and recognize one synthetic PNG without importing inventory
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_HOST" == '43.166.154.98' ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ && -n "$DEPLOY_SSH_KEY" ]]
          PORT="${DEPLOY_PORT:-22}"
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$PORT >= 1 && 10#$PORT <= 65535 ))
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/otcm-invoice-ocr/key"
          ssh-keyscan -T 15 -p "$PORT" "$DEPLOY_HOST" > "$RUNNER_TEMP/otcm-invoice-ocr/known_hosts" 2>/dev/null
          timeout --signal=TERM --kill-after=10s 210s ssh -p "$PORT" -i "$RUNNER_TEMP/otcm-invoice-ocr/key" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 -o LogLevel=ERROR \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/otcm-invoice-ocr/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'python3 -B -' \
            < "$RUNNER_TEMP/otcm-invoice-ocr/payload.py" > "$RUNNER_TEMP/otcm-invoice-ocr/report.json"
      - name: Save sanitized OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otcm-invoice-ocr-report
          path: ${{ runner.temp }}/otcm-invoice-ocr/report.json
          retention-days: 30
      - name: Remove runner SSH material and payload
        if: always()
        run: rm -f "$RUNNER_TEMP/otcm-invoice-ocr/key" "$RUNNER_TEMP/otcm-invoice-ocr/payload.py"
